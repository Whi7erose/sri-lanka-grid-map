  --bess:#d27af0; --ongrid:#59c46f; --hybrid:#3cc9c3; --offgrid:#ffa53a; --gridonly:#a3a9b1; --biz:#8b96ff;

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
.app{height:100%;display:grid;grid-template-columns:360px 1fr;min-height:0}
.side{background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;min-width:0}
.mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto;min-height:100%}
  .mapwrap{order:1;height:62vh}
  .side{order:2;border-right:0;border-top:1px solid var(--rule)}
}

/* header */
.hd{background:var(--accent);color:var(--accent-fg);padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;gap:12px;align-items:center}
.hd .badge{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--accent-fg) 18%,transparent);display:grid;place-items:center;flex:none}
.hd h1{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.2px;margin:0;line-height:1.1;text-wrap:balance}
.hd p{margin:2px 0 0;font-size:12px;opacity:.85}
.tabs{display:flex;border-bottom:1px solid var(--rule);padding-left:max(8px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:600 12px var(--f-body);padding:10px 2px;cursor:pointer;letter-spacing:.3px;text-transform:uppercase}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

.fact b{display:block;font:600 18px var(--f-display);letter-spacing:.2px}

.srcs{padding-left:18px;margin:6px 0;font-size:12.5px;color:var(--muted)}
.srcs li{margin:4px 0}
.srcs a{color:var(--accent)}

function solve(key){
  const sc = SCEN[key];

  const n = ids.length, P = new Float64Array(n);
  const W = NET.subs.reduce((a,s)=>a+s.w,0), WR = NET.subs.reduce((a,s)=>a+s.w*(RF[s.id]??1),0);
  const nodeLoad = {}, nodeRoof = {};
  NET.subs.forEach(s => { const ld = sc.demand*s.w/W, rf = sc.roof*s.w*(RF[s.id]??1)/WR; nodeLoad[s.id]=ld; nodeRoof[s.id]=rf; P[idx[s.id]] -= ld - rf; });
  const out = {};
  let fixedSum = 0;
  NET.gens.forEach(g => {
    let mw = 0;
    if (g.id in sc.fixed) mw = sc.fixed[g.id];
    else if (g.fuel==='wind') mw = g.mw*sc.wind;
    else if (g.fuel==='solar') mw = g.mw*sc.solar;

    if (g.fuel!=='hydro'){ out[g.id]=mw; fixedSum+=mw; }

  const spill = hydro < 0 ? -hydro : 0; hydro = Math.max(0, Math.min(hydro, hydCap));
  hyd.forEach(g => out[g.id] = hydro*g.mw/hydCap);
  NET.gens.forEach(g => P[idx[g.node]] += out[g.id]);
  NET.bess.forEach(b => P[idx[b.node]] += out[b.id]);
  // DC power flow, susceptance ~ kV^2 / (x per km * km)
  const slack = idx['kel'];
  const m = n-1, map = i => i < slack ? i : i-1;

  const lb = NET.lines.map(l => (l.kv*l.kv)/((l.cable?0.15:0.4)*l.km*100));
  NET.lines.forEach((l,k) => { const a=idx[l.a], b=idx[l.b], y=lb[k];
    if (a!==slack) B[map(a)][map(a)] += y; if (b!==slack) B[map(b)][map(b)] += y;
    if (a!==slack && b!==slack){ B[map(a)][map(b)] -= y; B[map(b)][map(a)] -= y; } });

    [B[c],B[p]]=[B[p],B[c]]; [rhs[c],rhs[p]]=[rhs[p],rhs[c]];
    for (let r=c+1;r<m;r++){ const f=B[r][c]/B[c][c]; if(!f) continue; for (let k=c;k<m;k++) B[r][k]-=f*B[c][k]; rhs[r]-=f*rhs[c]; } }
  const th = new Float64Array(m); for (let r=m-1;r>=0;r--){ let s=rhs[r]; for (let k=r+1;k<m;k++) s-=B[r][k]*th[k]; th[r]=s/B[r][r]; }
  const T = i => i===slack ? 0 : th[map(i)];
  const flows = {}; NET.lines.forEach((l,k) => flows[l.id] = lb[k]*(T(idx[l.a])-T(idx[l.b])));
  return {out, flows, nodeLoad, nodeRoof, hydro, spill, fixedSum, bessSum, netLoad};
}

function popSub(s){
  const r = RES[scen], ld = r.nodeLoad[s.id]||0, rf = r.nodeRoof[s.id]||0, net = ld-rf;
  const kind = s.kind==='gs220' ? (s.kv==='220 kV' ? 'Switchyard (220 kV)' : `Grid substation ${s.kv}, steps 220 kV down to 132 kV`)
    : s.kind==='gs132' ? (s.kv==='132 kV' ? 'Power station switchyard (132 kV)' : `Grid substation ${s.kv}, steps 132 kV down for distribution`) : s.kind==='tee' ? 'Line tee point' : 'Line junction';
  const gens = NET.gens.filter(g => g.node===s.id), bs = NET.bess.filter(b => b.node===s.id);
  let rows = '';
  if (ld > 0.05) {
    rows += tr('Local demand', mw(ld));
    if (rf > 0.05) rows += tr('Rooftop solar behind it', mw(rf));
    rows += tr(net >= 0 ? 'Drawn from the grid' : 'Sent back up to the grid', mw(net));
  }
  gens.forEach(g => rows += tr(esc(g.name.replace(/ Power Station| Power Complex/,'')), mw(r.out[g.id])));
  bs.forEach(b => rows += tr(esc(b.name), r.out[b.id] ? (r.out[b.id] > 0 ? 'discharging ' : 'charging ') + mw(r.out[b.id]) : b.status==='connected' ? 'idle' : b.status==='construction' ? 'being built' : b.status));
  linesAt(s.id).forEach(l => { const f = r.flows[l.id], other = N[l.a===s.id ? l.b : l.a];
    const outw = (l.a===s.id) === (f>0); const on = other.kind==='tee' ? 'line tee' : other.name.replace(/ Grid Substation.*| Switchyard| Power Station| \(CEB\)/g,'');
    rows += tr(`${l.kv} kV ${outw?'to':'from'} ${esc(on)}`, Math.abs(f)<0.5 ? '≈0' : `${outw?'→':'←'} ${mw(f)}`); });
  const say = ld > 0.05 && net < 0 ? `<p class="say">At ${SCEN[scen].label.toLowerCase()}, rooftop solar here is larger than local demand, so power flows backwards through the transformer, from 33 kV up into the 132 kV grid.</p>` : '';
  return `<div class="pp"><h4>${esc(s.name)}</h4><p class="ty">${kind}</p><table>${rows}</table>${say}${s.note?`<p class="src">${esc(s.note)}</p>`:''}${srcLine(s.src)}<p class="src">${SCEN[scen].label} figures are a model estimate, not metered data.</p></div>`;
}
function popLine(l){
  const r = RES[scen], f = r.flows[l.id], a = N[l.a], b = N[l.b];
  const from = f >= 0 ? a : b, to = f >= 0 ? b : a;

  return `<div class="pp"><h4>${esc(l.name)}</h4><p class="ty"><span class="chip" style="color:${C(col)}">${l.kv} kV ${l.cable?'UG cable':'overhead'}</span>${esc(a.name)} – ${esc(b.name)}</p>

function custFlow(c, s){
  const f = c.flows[s], k = CUST[c.kind], u = c.pv >= 40 ? 'kW' : 'kW';
  const has = {pv:c.pv>0, bat:c.bat>0, grid:!!c.dt};
  const node = (x,y,w,h,t,sub) => `<rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/><text x="${x+w/2}" y="${y+18}" text-anchor="middle" font-size="12" font-weight="600">${t}</text>${sub?`<text class="val" x="${x+w/2}" y="${y+33}" text-anchor="middle">${sub}</text>`:''}`;
  const wire = (d, val, col) => Math.abs(val) < 0.005 ? `<path class="wire" d="${d}"/>` : `<path class="wire" d="${d}"/><path class="live" style="stroke:${col}" d="${d}"/>`;
  const rev = d => { const p = d.match(/-?[\d.]+/g).map(Number); return `M${p[2]} ${p[3]}L${p[0]} ${p[1]}`; };
  let g = '';
  // PV -> inverter
  if (has.pv) g += wire('M70 46L135 46', f.pv, C('--solar'));
  // inverter -> loads
  g += wire('M205 46L250 46', f.load, C(k.col));
  if (has.bat) g += wire(f.bat >= 0 ? 'M170 66L170 110' : 'M170 110L170 66', f.bat, C('--bess'));
  if (has.grid) g += wire(f.grid >= 0 ? 'M300 128L300 82L270 66' : 'M270 66L300 82L300 128', f.grid, C('--d11'));
  let boxes = '';
  if (has.pv) boxes += node(6,24,64,44,'☀ Panels', `${fmt(f.pv,1)} ${u}`);
  boxes += node(135,24,70,44,'Inverter', c.bat? 'hybrid' : c.dt ? 'grid-tie' : 'off-grid');
  boxes += node(250,24,58,44,'Loads', `${fmt(f.load,1)} ${u}`);
  if (has.bat) boxes += node(130,110,80,44,'Battery', f.bat>0?`+${fmt(f.bat,1)} charge`:f.bat<0?`${fmt(-f.bat,1)} out`:'idle');
  if (has.grid) boxes += node(252,128,96,44, c.conn==='11 kV'?'11 kV line':'Grid meter', f.grid>0?`↓ ${fmt(f.grid,1)} import`:f.grid<0?`↑ ${fmt(-f.grid,1)} export`:'0');
  else boxes += `<text x="300" y="150" text-anchor="middle" font-size="11.5" fill="${C('--muted')}">no grid connection</text>`;
  return fixVar(`<svg class="cf" viewBox="0 0 352 176" role="img" aria-label="Power flow for ${esc(c.name)}">${g}${boxes}</svg>`);
}

function txFlow(t){   // positive = stepping down (towards customers), negative = stepping up
  const r = RES[scen];
  if (t.role==='up') return {v:-(r.out[t.gen.id]||0), u:'MW'};
  if (t.role==='bess') return {v:-(r.out[t.bess.id]||0), u:'MW'};
  if (t.role==='dist') { const f = DFLOW[t.dn.id]; return {v:f[scen], u:f.u}; }
  if (t.role==='cust') { const f = t.cust.flows[scen]; return {v:f.grid, u:'kW'}; }
  if (t.role==='ib') {
    let p = 0; linesAt(t.node).forEach(l => { if (l.kv!==220) return; const f = r.flows[l.id]; p += l.b===t.node ? f : -f; });
    NET.gens.forEach(g => { if (g.node===t.node && g.kv===220) p += r.out[g.id]||0; });
    if (t.node==='man') p = 0;
    return {v:p, u:'MW'};
  }
  let v = (r.nodeLoad[t.node]||0) - (r.nodeRoof[t.node]||0);
  NET.gens.forEach(g => { if (g.node===t.node && g.kv===33) v -= r.out[g.id]||0; });
  NET.bess.forEach(b => { if (b.node===t.node) v -= r.out[b.id]||0; });
  return {v, u:'MW'};
}

    + ar.replace(/var\(--c\)/g, `var(${col})`).replace(/stroke="var\((--[\w-]+)\)"/g,'style="stroke:var($1)"') + '</svg>';
}

const hiddenSer = new Set();

      g += '</g>';

    if (D.flags[i]) g += `<circle cx="${x+w/2}" cy="${y(0)+6}" r="2" class="qf"/>`;
    if (i % every === 0) g += `<text x="${x+w/2}" y="${H-pb+19}" text-anchor="middle" class="ax">${lab}</text>`;

function renderNews(){
  $('#view-news').innerHTML = `<div class="rp"><header class="rp-hd"><div><h2>Power failures: what happened and why</h2><p>Every island-wide blackout with a published account since 2015, plus the 2019 drought cuts and the June 2022 outages, newest first.</p></div></header>
   <div class="facts nw">
    <div class="fact"><b>7</b><span>island-wide collapses since 2015</span></div>
    <div class="fact"><b>3 of 7</b><span>left the coal plant offline for 3–5 days (2020, 2025, 2026)</span></div>
    <div class="fact"><b>2</b><span>triggered on sunny weekends with solar over half of demand</span></div>
    <div class="fact"><b>0</b><span>reports of AI in detection or restoration</span></div></div>
   <section class="rp-sec pattern"><h2>The pattern</h2>
    <p>Each collapse starts with one fault: a line, a transformer or a single generator. It spreads because the grid has little margin. It depends on one 900 MW coal plant and a few long lines from the hills to Colombo. In recent years there is also a large block of rooftop solar, close to 2,000 MW, that the control room cannot see or switch, and much of it trips at the first dip in frequency.</p>
    <p>Restoration usually starts from hydro plants such as Kotmale, Victoria and Samanalawewa, because they can start without outside power. Control-room engineers then energise one section at a time and reconnect customers in blocks. The coal plant is the slow part: its boilers must cool for 3 to 4 days before a restart, so blackouts are followed by days of rotating cuts.</p>
    <p>Who decides: until March 2026 the Ceylon Electricity Board ran generation, transmission and system control. It has since been split into the National System Operator (runs the grid), NTNSP (transmission lines), Electricity Generation Lanka (power stations) and Electricity Distribution Lanka (customers). The Ministry appoints inquiry committees after each event. PUCSL, the regulator, investigates and can issue binding directions, as it did in February 2026.</p>
    <p>On AI: none of the published reports mention artificial intelligence in causing, detecting or restoring a blackout. Restoration is manual, guided by a written restoration manual. The fixes ordered so far are automation and monitoring: adaptive load shedding, real-time visibility of rooftop solar and disturbance recorders. We found machine-learning solar forecasting only in university research, not in grid operations.</p></section>

const CHEV = (s) => fixVar(`<svg width="${s}" height="${s}" viewBox="-6 -6 12 12"><path d="M-4.5 -4.5 4 0 -4.5 4.5 -2.4 0z" fill="currentColor" stroke="${C('--arrow-edge')}" stroke-width="1.2" stroke-linejoin="round"/></svg>`);
function lineFlow(o){
  const l = o.l, r = RES[scen];
  if (o.genLink) return {mw: r.out[l.id] || 0, unit:'MW'};
  if (o.bessLink) return {mw: r.out[l.id] || 0, unit:'MW'};
  if (l.dist) { const f = DFLOW[l.down]; return {mw: -f[scen], unit:f.u}; }   // a->b is downstream; flow towards customers is negative a->b in this sign
  if (l.svc) { return {mw: -l.cust.flows[scen].grid, unit:'kW'}; }
  return {mw: r.flows[l.id], unit:'MW'};
}
function drawFlows(){
  lineObjs.forEach(o => {
    o.lg.clearLayers();
    let {mw: f, unit} = lineFlow(o);
    // sign convention: positive means from a to b (for gen/bess links: a = plant)
    if (o.l.dist || o.l.svc) f = -f; // stored as downstream positive
    const mag = Math.abs(f);
    const tiny = unit==='MW' ? (o.l.dist ? 0.05 : 0.5) : 0.05;
    if (mag < tiny) return;
    const A = typeof o.l.a==='string' ? N[o.l.a] : o.l.a, B = typeof o.l.b==='string' ? N[o.l.b] : o.l.b; const pa = [A.lat, A.lon], pb = [B.lat, B.lon];
    const from = f > 0 ? pa : pb, to = f > 0 ? pb : pa;
    const fl = L.polyline([from, to], {className:'flow', weight:o.w+1.6, interactive:false});
    o.lg.addLayer(fl);
    const mwEq = unit==='kW' ? mag/1000*40 : mag;   // speed scale
    const dur = Math.max(0.5, Math.min(3.2, 3.4 - Math.log10(mwEq+1)*1.2));
    requestAnimationFrame(() => { const el = fl.getElement(); if (el) el.style.animationDuration = dur+'s'; });
    const p1 = map.project(from, 0), p2 = map.project(to, 0);
    const ang = Math.atan2(p2.y-p1.y, p2.x-p1.x)*180/Math.PI;
    const km = o.l.km || 2;
    const n = o.l.gen || o.l.bess || o.l.dist || o.l.svc ? 1 : km > 60 ? 3 : km > 18 ? 2 : 1;
    const s = o.l.kv===220 ? 15 : o.l.kv===132 ? 12 : 10;
    const col = o.l.cable ? '--cable' : o.l.kv===220 ? '--kv220' : o.l.kv===132 ? '--kv132' : o.l.kv===33 ? '--d33' : o.l.kv===11 ? '--d11' : '--lv';
    for (let i=1;i<=n;i++){
      const t = i/(n+1); const p = [from[0]+(to[0]-from[0])*t, from[1]+(to[1]-from[1])*t];
      o.lg.addLayer(L.marker(p, {pane:'arrowPane', interactive:false, keyboard:false,
        icon:L.divIcon({className:'arw', html:`<div style="color:${C(col)};transform:rotate(${ang}deg);width:${s}px;height:${s}px">${CHEV(s)}</div>`, iconSize:[s,s], iconAnchor:[s/2,s/2]})}));
    }
  });
}

      wrap.innerHTML = `<div class="gh"><button class="chev" type="button" aria-expanded="${open}" aria-label="Show items in ${esc(label)}">${CHEVRON}</button>${ic}<span class="gl">${esc(label)}</span><span class="ct">${items.length}</span><input type="checkbox" class="cb sm" id="g_${key}" checked aria-label="Show ${esc(label)}"></div>
        <ul class="items" ${open?'':'hidden'}></ul>`;
      const ul = wrap.querySelector('ul');
      items.forEach(it => { const li = document.createElement('li'); const b = document.createElement('button'); b.type='button';
        b.title = it.sub || it.name; b.dataset.q = (it.name+' '+(it.sub||'')).toLowerCase();
        b.innerHTML = `${esc(it.name)}${it.mw?`<span class="mw">${fmt(it.mw,it.mw%1?1:0)} MW</span>`:''}${it.src==='approx'?'<span class="src">≈</span>':''}`;
        b.addEventListener('click', () => { visible[key] = true; wrap.querySelector('input').checked = true; fcb.checked = true; goTo(it); });
        li.appendChild(b); ul.appendChild(li); });
      const chev = wrap.querySelector('.chev');
      chev.addEventListener('click', () => { const ex = chev.getAttribute('aria-expanded')==='true'; chev.setAttribute('aria-expanded', !ex); ul.hidden = ex; });
      const gcb = wrap.querySelector('input'); gcbs.push([key,gcb]);
      gcb.addEventListener('change', () => { visible[key] = gcb.checked; fcb.checked = gcbs.some(([,c])=>c.checked); syncLayers(); });
      sec.appendChild(wrap);
    });
    fcb.addEventListener('change', () => { gcbs.forEach(([k,c]) => { c.checked = fcb.checked; visible[k] = fcb.checked; }); syncLayers(); });
    if (F.note) { const p = document.createElement('p'); p.className='note'; p.textContent = F.note; sec.appendChild(p); }
    root.appendChild(sec);
  });
  const p = document.createElement('p'); p.className = 'note';
  p.innerHTML = 'Dashed lines and items marked ≈ were added from public sources; their positions are approximate. Everything else is from the NTNSP map.';
  root.appendChild(p);
}
$('#q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.grp').forEach(g => {
    const btns = g.querySelectorAll('.items button'); let hit = 0;
    btns.forEach(b => { const m = !q || b.dataset.q.includes(q); b.parentElement.hidden = !m; hit += m; });
    const ul = g.querySelector('.items'), ch = g.querySelector('.chev');
    if (q) { g.hidden = !hit; ul.hidden = !hit; ch.setAttribute('aria-expanded', !!hit); } else { g.hidden = false; }
  });
});

/* ------------------------------------------------------------------ balance card */
function balance(){
  const r = RES[scen], sc = SCEN[scen];
  const sum = f => NET.gens.filter(g=>g.fuel===f).reduce((a,g)=>a+(r.out[g.id]||0),0);
  const bess = NET.bess.reduce((a,b)=>a+(r.out[b.id]||0),0);
  const parts = [['Rooftop solar (behind the meter)', sc.roof, '--solar'],['Coal', sum('coal'), '--coal'],['Major hydro', sum('hydro'), '--hydro'],
    ['Oil and gas', sum('thermal'), '--thermal'],['Wind', sum('wind'), '--wind'],['Solar farms and mini-hydro (examples)', sum('solar')+sum('minihydro'), '--mini'],
    ['Battery', bess, '--bess']];
  const tot = sc.demand;
  const bar = parts.filter(p=>p[1]>0).map(p => `<span style="width:${(p[1]/tot*100).toFixed(1)}%;background:${C(p[2])}" title="${p[0]}"></span>`).join('');
  const rows = parts.map(p => `<span class="k"><i style="background:${C(p[2])}"></i>${p[0]}</span><span class="v">${p[1]<0?'−':''}${fmt(Math.abs(p[1]))} MW${p[1]<0?' (charging)':''}</span>`).join('');
  $('#balance').innerHTML = `<button class="x" type="button" aria-label="Close" onclick="this.parentElement.classList.remove('open')">×</button><h3>${sc.label} · ${sc.time}</h3><p class="sub">Island demand about ${fmt(sc.demand)} MW (model)</p>
    <div class="bar" role="img" aria-label="Share of supply by source">${bar}</div><div class="brow">${rows}</div><p class="msg">${sc.say}</p>`;
}
$('#balbtn').addEventListener('click', () => $('#balance').classList.toggle('open'));

/* ------------------------------------------------------------------ how it flows */

  const arrow = (dir, col) => `<span class="ar"><svg width="18" height="22" viewBox="0 0 18 22" style="transform:rotate(${dir==='up'?180:0}deg)"><path d="M9 2v16M3 12l6 7 6-7" stroke="${C(col)}" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></span>`;
  const st = (sym, title, kv, txt) => `<li class="stage"><span class="sym">${sym}</span><div><h3>${title} ${kv?`<span class="kv">${kv}</span>`:''}</h3><p>${txt}</p></div></li>`;
  const lk = (dir, col, why) => `<li class="link ${dir==='up'?'up':''}">${arrow(dir,col)}<span class="why">${why}</span></li>`;
  $('#pane-how').innerHTML = `
  <h2 class="sec">From power station to plug · ${SCEN[sc].label}</h2>

  <ol class="chain">
    ${st(ICON_SMALL(SVG.coal).replace('gi',''), 'Power station', '11–20 kV', 'Coal at Lakvijaya, hydro in the hills, oil and gas near Colombo, wind on Mannar Island.')}
    ${lk('down','--kv220','Step-up transformer raises voltage so power can travel far with low losses.')}
    ${st(LINE_ICON('--kv220').replace('gi',''), 'Transmission grid', '220 kV · 132 kV', 'NTNSP lines carry bulk power across the island. Colombo is fed by underground 132 kV cables.')}
    ${lk('down','--kv132','Grid substation steps 132 kV down to 33 kV.')}
    ${st(ICON_SMALL(SVG.gs132).replace('gi',''), 'Grid substation', '132/33 kV', 'Batteries, solar farms and mini-hydro also connect here or on the 33 kV lines.')}
    ${lk(up?'up':'down','--d33', up?'Midday: in sunny areas the flow can reverse and rise from 33 kV into the grid.':'Power flows down to the town.')}
    ${st(ICON_SMALL(SVG.primary).replace('gi',''), 'Primary substation', '33/11 kV', 'Feeds 11 kV lines along main roads.')}
    ${lk(up?'up':'down','--d11', up?'Midday: rooftop surplus from many homes adds up and flows back towards 33 kV.':'Power flows down the 11 kV feeder.')}
    ${st(ICON_SMALL(SVG.dt).replace('gi',''), 'Distribution transformer', '11 kV/400 V', 'The pole or ground transformer on your street.')}
    ${lk(up?'up':'down','--lv', up?'Midday: homes with on-grid solar export surplus to neighbours first.':'Homes and shops draw power at 230 V or 400 V.')}
    ${st(ICON_SMALL(CUST.home_ongrid.svg).replace('gi',''), 'Homes and businesses', '230 V · 400 V', 'Some have rooftop solar, some add a battery, some are not connected at all.')}
  </ol>
  <h2 class="sec">Customer types</h2>
  ${[['home_ongrid','On-grid home (Net Plus)','About 5 kWp, no battery','Midday: panels → home loads → surplus ↑ to the street transformer. Night: grid ↓ → home. Grid-tie inverters switch off in a power cut. New connections after 11 Sep 2026 are Net Plus only.'],
     ['home_hybrid','Hybrid home','Solar + hybrid inverter + battery','Midday: panels → loads → battery charges → surplus ↑. Evening or outage: battery → loads. Reported tariff for new solar + storage: LKR 45.53/kWh for 15 years in the prioritised period, then LKR 15.81.'],
     ['home_offgrid','Off-grid home','Solar + battery, no grid','Panels → battery → loads. No connection, so no arrows to the grid and nothing reaches the national system.'],
     ['home_grid','Home without solar','Grid only','Always draws from the grid through the street transformer.'],
     ['biz_ongrid','Business','Three-phase, 10 kW to over 250 kW','Midday: solar feeds site loads first, surplus ↑. Night: grid ↓. Feed-in: up to 10 kW LKR 23.11, 10–40 kW 19.15, 40–250 kW 17.11, above 250 kW 15.81 per kWh. Large sites connect at 11 or 33 kV.']]
   .map(([k,t,lead,p]) => `<div class="ctype"><span>${ICON_SMALL(CUST[k].svg).replace('gi','')}</span><div><h3>${t}</h3><p class="lead">${lead}</p><p>${p}</p></div></div>`).join('')}
  <h2 class="sec">Why storage matters</h2>
  <div class="facts">
    <div class="fact"><b>3,070+ MW</b><span>Solar capacity reported in 2026, rooftop and ground</span></div>
    <div class="fact"><b>10 MW / 40 MWh</b><span>First grid battery, Anuradhapura, connected Sep 2026</span></div>
    <div class="fact"><b>160 MW / 640 MWh</b><span>16-site battery programme; 15 sites due late 2026</span></div>
    <div class="fact"><b>250 MW / 1,000 MWh</b><span>2026 tender, 25 sites, target May 2027</span></div>
    <div class="fact"><b>600 MW</b><span>Maha Oya pumped storage, under development</span></div>

  </div>

  <h2 class="sec">Map symbols</h2>
  <div>${[[LINE_ICON('--kv220'),'220 kV'],[LINE_ICON('--kv132'),'132 kV'],[LINE_ICON('--cable'),'132 kV cable'],[LINE_ICON('--d33'),'33 kV'],[LINE_ICON('--d11'),'11 kV'],[LINE_ICON('--lv'),'400/230 V'],[LINE_ICON('--kv132',1),'added, approximate'],
    [ICON_SMALL(SVG.gs220),'220/132 kV substation'],[ICON_SMALL(SVG.gs132),'132/33 kV step-down'],[ICON_SMALL(SVG.sw),'switchyard'],[ICON_SMALL(SVG.bess('connected')),'battery, connected'],[ICON_SMALL(SVG.bess('construction')),'battery, being built'],[ICON_SMALL(SVG.bess('tendered')),'battery, tendered'],[ICON_SMALL(SVG.bess('planned')),'pumped storage, planned'],[`<span class="gi" style="width:30px">${txSvg('up')}</span>`,'transformer stepping up'],[`<span class="gi" style="width:30px">${txSvg('down')}</span>`,'transformer stepping down']]

}
function sources(){
  $('#pane-src').innerHTML = `<h2 class="sec">Data and sources</h2>
  <ul class="srcs">
    <li>Lines, substations and voltages: <a href="https://www.google.com/maps/d/viewer?mid=1xr4HzUvarqrAStfSf9HyufbT76vg454" target="_blank" rel="noopener">NTNSP network transmission map</a> (Google My Maps). The export could be read for the Head Office, all 24 segments of the 220 kV folder, 48 substations and about 60 of the 132 kV lines. The rest (Deniyaya onwards, remaining 132 kV lines and the underground cables) was added from public knowledge and is marked ≈ or dashed.</li>
    <li>Plant list and capacities: Wikipedia “List of power stations in Sri Lanka” (older, partly outdated). Positions approximate.</li>

    <li>Tariffs: <a href="https://www.pv-magazine.com/2026/09/22/sri-lanka-replaces-net-metering-with-feed-in-tariffs-for-rooftop-solar/" target="_blank" rel="noopener">pv magazine, 22 Sep 2026</a>.</li>
    <li>Solar capacity: <a href="https://www.newswire.lk/zv4t" target="_blank" rel="noopener">Newswire</a> (3,070 MW); rooftop 1,700 MW as of May 2025, <a href="https://www.themorning.lk/articles/6ZtlzqFg8dR6M1cb7fSz" target="_blank" rel="noopener">The Morning</a>.</li>
    <li>Blackout: <a href="https://kuwaittimes.com/article/51761/world/sri-lanka-hit-by-nationwide-blackout-as-grid-trips/" target="_blank" rel="noopener">AFP via Kuwait Times, 17 Oct 2026</a>.</li>
    <li>Generation by source, monthly and daily: <a href="https://gendata.pucsl.gov.lk/generation-profile" target="_blank" rel="noopener">PUCSL Electricity Dispatch Data portal</a>, CSV export, 27 Oct 2026. Yearly: <a href="https://github.com/owid/energy-data" target="_blank" rel="noopener">Our World in Data</a> (Ember).</li>
    <li>Sales and accounts by customer type: CEB Statistical Digests <a href="https://ceb.lk/front_img/img_reports/1536209909CEB_Statistical_Digest_2017_-_Web.pdf" target="_blank" rel="noopener">2017</a>, <a href="https://www.ceb.lk/front_img/img_reports/1626946210CEB-Statistical_Digest-Form-2020-Web_Version.pdf" target="_blank" rel="noopener">2020</a>, <a href="https://ceb.lk/front_img/img_reports/1687251906Statistical_Digest_2022.pdf" target="_blank" rel="noopener">2022</a>, <a href="https://ceb.lk/front_img/img_reports/1751344405Statistical_Digest_2024.pdf" target="_blank" rel="noopener">2024</a>, <a href="https://www.ceb.lk/front_img/img_reports/1783569007SD-2025-Finalized-(Web-Edition).pdf" target="_blank" rel="noopener">2025</a>.</li>

  <h2 class="sec">How the flows are worked out</h2>

/* ------------------------------------------------------------------ scenario switching */
function setScen(k){
  scen = k;
  document.querySelectorAll('.seg button[data-s]').forEach(b => b.setAttribute('aria-pressed', b.dataset.s===k));
  drawFlows(); updateTx(); balance(); how();
  if (openRef) openRef.layer.setPopupContent(openRef.fn());
}
document.querySelectorAll('.seg button[data-s]').forEach(b => b.addEventListener('click', () => setScen(b.dataset.s)));
$('#buildtoggle').addEventListener('change', e => { withBuild = e.target.checked; solveAll(); setScen(scen); });
$('#flowtoggle').addEventListener('change', e => $('#map').classList.toggle('noflow', !e.target.checked));

document.querySelectorAll('.tabs button').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tabs button').forEach(x => { const on = x===t; x.setAttribute('aria-selected', on); $('#'+x.getAttribute('aria-controls')).hidden = !on; });
}));

map.on('zoomend', syncLayers);
buildFolders(); sources(); syncLayers(); setScen('midday');
window.__grid = {RES, NET};
})();
</script>
